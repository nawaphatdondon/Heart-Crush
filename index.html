<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Heart Crush Boss Creator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@600;700&display=swap">
<style>
/* Layout: wizard column (steps) beside a sticky live Boss Card; stacks on phones. Single dark look, pink accent, matching the game's own UI. */
:root {
  --bg: #0e0d14;
  --panel: #17151f;
  --panel-2: #1e1b29;
  --line: #2f2b3d;
  --fg: #f4f1f8;
  --muted: #9d97b0;
  --accent: #ff3fb4;
  --accent-soft: rgba(255, 63, 180, .14);
  --warn: #ffb454;
  --ok: #5fd39a;
  --font-display: "Quicksand", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.logo { width: clamp(150px, 26vw, 210px); height: auto; display: block; }
.badge { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }

.stepper { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 6px; scrollbar-width: thin; }
.stepper button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font: 500 13px var(--font-body); padding: 4px 8px 4px 4px; border-radius: 999px; cursor: pointer; }
.stepper .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); font: 600 12px var(--font-display); font-variant-numeric: tabular-nums; }
.stepper .done .n { border-color: var(--accent); color: var(--accent); }
.stepper .cur { color: var(--fg); }
.stepper .cur .n { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(255, 63, 180, .55); }
.stepper button:focus-visible, .btn:focus-visible, .opt:focus-visible, .sw:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cols { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 920px) { .cols { grid-template-columns: minmax(0, 1fr) 320px; } .side { position: sticky; top: 16px; } }

h1 { font: 700 clamp(28px, 5vw, 40px)/1.1 var(--font-display); margin: 18px 0 6px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.lead { color: var(--muted); margin: 0 0 22px; max-width: 60ch; }
.label { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }
.label:first-of-type { margin-top: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

.opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.opt { position: relative; text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 13px; cursor: pointer; font: inherit; min-height: 74px; display: flex; flex-direction: column; gap: 3px; transition: border-color .15s, background .15s, box-shadow .15s; }
.opt:hover { border-color: #4a4560; }
.opt b { font: 700 15px var(--font-display); }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); box-shadow: 0 0 0 1px var(--accent), 0 0 22px rgba(255, 63, 180, .28); }
.opt[aria-pressed="true"]::after { content: "\2713"; position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; display: grid; place-items: center; }
.opt[disabled] { opacity: .5; cursor: not-allowed; }
.soon { align-self: flex-start; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt { min-height: 0; padding: 8px 14px; border-radius: 999px; flex-direction: row; align-items: center; }
.chips .opt b { font: 600 13.5px var(--font-body); }
.chips .opt[aria-pressed="true"]::after { position: static; width: auto; height: auto; background: none; color: var(--accent); margin-left: 6px; font-size: 13px; }

.sws { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(255, 63, 180, .6); }
.swname { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 20px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; }
.field > span i { color: var(--accent); font-style: normal; }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
textarea { min-height: 92px; resize: vertical; }
input::placeholder, textarea::placeholder { color: #6c6682; }
.row2 { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 6px 0 14px; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.btn { font: 600 14px var(--font-display); border-radius: 999px; padding: 11px 24px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 20px rgba(255, 63, 180, .35); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.art { height: 150px; display: grid; place-items: center; position: relative; }
.art .mono { font: 700 72px var(--font-display); color: rgba(255, 255, 255, .9); text-shadow: 0 4px 24px rgba(0, 0, 0, .45); }
.art .el { position: absolute; top: 10px; left: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: rgba(0, 0, 0, .45); padding: 3px 10px; border-radius: 999px; }
.art .diff { position: absolute; top: 10px; right: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: rgba(0, 0, 0, .45); padding: 3px 10px; border-radius: 999px; }
.cbody { padding: 16px; }
.cname { font: 700 22px/1.15 var(--font-display); overflow-wrap: anywhere; }
.ctitle { color: var(--accent); font-size: 13px; margin-top: 2px; min-height: 19px; overflow-wrap: anywhere; }
.facts { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; font-size: 13px; }
.facts li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
.facts li span:first-child { color: var(--muted); flex: none; }
.facts li span:last-child { text-align: right; overflow-wrap: anywhere; }
.dots { display: inline-flex; gap: 5px; vertical-align: middle; margin-right: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); display: block; }
.quote { margin: 14px 0 0; font-size: 13px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }

.review-list { display: grid; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
.review-list li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.review-list .ok { color: var(--ok); } .review-list .no { color: var(--warn); }
.code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 220px; white-space: pre; overflow-x: auto; }
.tabs { display: flex; gap: 8px; margin: 18px 0 10px; flex-wrap: wrap; }
.msg { font-size: 13px; color: var(--ok); min-height: 20px; margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { .stepper .t { display: none; } .stepper .cur .t { display: inline; } .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

  function label(list, id) { var r = find(list, id); return r ? r[1] : id; }

  function cards(key, list, opts) {
    opts = opts || {};
    return '<div class="opts">' + list.map(function (r) {
      var id = r[0], name = r[1], note = r[2];
      var on = opts.multi ? S[key].indexOf(id) > -1 : S[key] === id;

  }
  function chips(key, items, multi, max) {
    return '<div class="chips">' + items.map(function (n) {
      var on = multi ? S[key].indexOf(n) > -1 : S[key] === n;
      return '<button type="button" class="opt" data-k="' + key + '" data-v="' + esc(n) + '"' + (multi ? ' data-multi="1" data-max="' + (max || 99) + '"' : '') + ' aria-pressed="' + on + '"><b>' + esc(n) + '</b></button>';

        ["Boss name", !!S.name.trim()], ["Patreon name", !!S.patreon.trim()], ["Tier selected", !!S.tier], ["Adult and usage permission ticked", !!S.consent]
      ];
      return '<div class="row2">' + field("patreon", "Your Patreon name", { req: true, max: 60 }) + '</div>' +
        '<span class="label" style="margin-top:4px">Your tier <i style="color:var(--accent);font-style:normal">*</i></span>' + chips("tier", TIERS, false) + '<div style="height:20px"></div>' +
        field("notes", "Notes for the creator (optional)", { area: true, max: 400 }) +
        '<label class="check"><input type="checkbox" id="f-consent" data-c="consent"' + (S.consent ? " checked" : "") + '><span>I am a Patreon member, this character is an adult (18+) and my own idea, and I allow it to be used in ' + esc(CONFIG.game) + ' Boss Rush.</span></label>' +
        '<ul class="review-list" id="checks">' + checkHtml(checks) + '</ul>' +
        '<div class="tabs"><button type="button" class="btn ' + (fmt === "text" ? "primary" : "") + '" data-fmt="text">Readable text</button><button type="button" class="btn ' + (fmt === "json" ? "primary" : "") + '" data-fmt="json">JSON</button></div>' +
        '<textarea class="code" id="out" readonly aria-label="Submission code">' + esc(buildOut()) + '</textarea>' +
        '<div class="tabs"><button type="button" class="btn primary" id="copy"' + (miss ? " disabled" : "") + '>Copy submission</button>' +
        (CONFIG.submitUrl ? '<a class="btn" style="text-decoration:none" href="' + esc(CONFIG.submitUrl) + '" target="_blank" rel="noopener">' + esc(CONFIG.submitLabel) + '</a>' : "") +
        '<button type="button" class="btn ghost" id="reset">Start over</button></div>' +
        '<div class="msg" id="msg" role="status"></div>' +
        '<p class="note">' + (CONFIG.submitUrl ? "Copy the submission, then open the link and paste it into your message." : "Copy the submission and paste it into a Patreon message to the creator.") + ' Your progress is saved in this browser until you start over.</p>';
    }
  ];

  function checkHtml(checks) { return checks.map(function (c) { return '<li><span class="' + (c[1] ? "ok" : "no") + '">' + (c[1] ? "✓" : "○") + '</span>' + esc(c[0]) + '</li>'; }).join(""); }
  function missing() { return !S.name.trim() || !S.patreon.trim() || !S.tier || !S.consent; }

  function jobName() { return S.jobCustom.trim() || S.job; }
  function payload() {
    return {
      game: CONFIG.game, mode: "Boss Rush",
      patreon: S.patreon.trim(), tier: S.tier,
      boss: { name: S.name.trim(), title: S.title.trim(), occupation: jobName() },
      look: {
        type: "Male (human)", trait: label(DATA.traits, S.trait), body: label(DATA.bodies, S.body), custom_build: S.buildCustom.trim(), skin: label(DATA.skins, S.skin),
        hair_style: S.hairStyle, hair_color: label(DATA.hairColors, S.hairColor), eye_color: label(DATA.eyeColors, S.eyeColor), details: S.details.concat(S.detailsCustom.trim() ? [S.detailsCustom.trim()] : [])
      },
      personality: { traits: S.vibes },
      battle: { intro_line: S.intro.trim(), win_line: S.win.trim(), defeat_line: S.defeat.trim() },
      backstory: S.backstory.trim(), notes: S.notes.trim()
    };
  }
  function buildOut() {
    var p = payload();
    if (fmt === "json") return JSON.stringify(p, null, 2);
    var L = [];
    L.push("HEART CRUSH BOSS RUSH SUBMISSION", "");
    L.push("Patreon: " + (p.patreon || "-"), "Tier: " + (p.tier || "-"));
    L.push("", "BOSS", "Name: " + (p.boss.name || "-"), "Title: " + (p.boss.title || "-"), "Occupation: " + p.boss.occupation);
    L.push("", "LOOK", "Type: " + p.look.type, "Trait: " + p.look.trait, "Body: " + p.look.body + (p.look.custom_build ? " (" + p.look.custom_build + ")" : ""), "Skin: " + p.look.skin, "Hair: " + p.look.hair_style + ", " + p.look.hair_color, "Eyes: " + p.look.eye_color, "Details: " + (p.look.details.join(", ") || "none"));
    L.push("", "PERSONALITY", "Traits: " + (p.personality.traits.join(", ") || "-"));
    L.push("", "BATTLE", "Intro line: " + (p.battle.intro_line || "-"), "Win line: " + (p.battle.win_line || "-"), "Defeat line: " + (p.battle.defeat_line || "-"));
    if (p.backstory) L.push("", "BACKSTORY", p.backstory);
    if (p.notes) L.push("", "NOTES", p.notes);
    return L.join("\n");
  }

  // ---- preview card ----
  function renderPreview() {
    var hair = (find(DATA.hairColors, S.hairColor) || [0, 0, "#444"])[2];
    var eye = (find(DATA.eyeColors, S.eyeColor) || [0, 0, "#444"])[2];
    var skin = (find(DATA.skins, S.skin) || [0, 0, "#ccc"])[2];
    var nm = S.name.trim();
    var det = S.details.concat(S.detailsCustom.trim() ? [S.detailsCustom.trim()] : []);
    var el = document.getElementById("preview");
    el.innerHTML =
      '<div class="art" style="background:linear-gradient(145deg,' + hair + ' 0%,#1a1824 70%)"><span class="mono">' + esc(nm ? nm.charAt(0).toUpperCase() : "?") + '</span></div>' +
      '<div class="cbody"><div class="cname">' + esc(nm || "Unnamed boss") + '</div><div class="ctitle">' + esc(S.title.trim()) + '</div>' +
      '<ul class="facts">' +
      '<li><span>Occupation</span><span>' + esc(jobName()) + '</span></li>' +
      '<li><span>Trait</span><span>' + esc(label(DATA.traits, S.trait)) + '</span></li>' +
      '<li><span>Body</span><span>' + esc(label(DATA.bodies, S.body)) + '</span></li>' +
      '<li><span>Colors</span><span><span class="dots"><i style="background:' + skin + '" title="Skin"></i><i style="background:' + hair + '" title="Hair"></i><i style="background:' + eye + '" title="Eyes"></i></span>' + esc(S.hairStyle) + '</span></li>' +
      '<li><span>Details</span><span>' + esc(det.join(", ") || "None") + '</span></li>' +
      '<li><span>Mind</span><span>' + esc(S.vibes.join(", ") || "-") + '</span></li>' +
      '</ul>' +
      (S.intro.trim() ? '<p class="quote">“' + esc(S.intro.trim()) + '”</p>' : '') + '</div>';
  }

  // ---- render ----
  function renderStepper() {
    document.getElementById("stepper").innerHTML = STEPS.map(function (s, i) {
      return '<button type="button" data-go="' + i + '" class="' + (i === step ? "cur" : i < step ? "done" : "") + '"' + (i === step ? ' aria-current="step"' : "") + '><span class="n">' + (i + 1) + '</span><span class="t">' + s[0] + '</span></button>';
    }).join("");
  }
  function render(focusTop) {
    var s = STEPS[step];
    document.getElementById("main").innerHTML =
      '<h1>' + s[1] + '</h1><p class="lead">' + s[2] + '</p><div id="view">' + VIEWS[step]() + '</div>' +
      '<div class="nav"><button type="button" class="btn" data-nav="-1"' + (step === 0 ? " disabled" : "") + '>Back</button>' +
      (step < STEPS.length - 1 ? '<button type="button" class="btn primary" data-nav="1">Next</button>' : "<span></span>") + '</div>';
    renderStepper(); renderPreview(); persist();
    if (focusTop) { var h = document.querySelector("h1"); if (h && h.scrollIntoView) h.scrollIntoView({ block: "start", behavior: "smooth" }); }
  }
  function refreshReview() {
    var out = document.getElementById("out"); if (out) out.value = buildOut();
    var checks = document.getElementById("checks");
    if (checks) checks.innerHTML = checkHtml([["Boss name", !!S.name.trim()], ["Patreon name", !!S.patreon.trim()], ["Tier selected", !!S.tier], ["Adult and usage permission ticked", !!S.consent]]);
    var c = document.getElementById("copy"); if (c) c.disabled = missing();
  }

  // ---- events ----
  var main = document.getElementById("main");
  main.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.nav) { step = Math.max(0, Math.min(STEPS.length - 1, step + Number(t.dataset.nav))); render(true); return; }
    if (t.dataset.fmt) { fmt = t.dataset.fmt; render(false); return; }
    if (t.id === "copy") { doCopy(); return; }
    if (t.id === "reset") {
      if (t.dataset.sure) { S = JSON.parse(JSON.stringify(DEFAULTS)); step = 0; render(true); return; }
      t.dataset.sure = "1"; t.textContent = "Click again to erase everything"; return;
    }
    if (t.dataset.k) {
      var k = t.dataset.k, v = t.dataset.v;
      if (t.dataset.multi) {
        var a = S[k], i = a.indexOf(v), max = Number(t.dataset.max || 99);
        if (i > -1) a.splice(i, 1); else if (a.length < max) a.push(v);
        t.parentNode.querySelectorAll("[data-k=" + k + "]").forEach(function (b) { b.setAttribute("aria-pressed", S[k].indexOf(b.dataset.v) > -1); });
      } else {
        S[k] = (k === "difficulty" || k === "skin" || k === "hairColor" || k === "eyeColor" || k === "body" || k === "trait" || k === "type") ? v : v;
        var group = t.closest(".opts, .chips, .sws");
        group.querySelectorAll("[data-k=" + k + "]").forEach(function (b) { b.setAttribute("aria-pressed", b === t); });
        var nm = document.querySelector('.swname[data-for="' + k + '"]'); if (nm) nm.textContent = t.dataset.name || "";
        if (k === "job") { S.jobCustom = ""; var jc = document.getElementById("f-jobCustom"); if (jc) jc.value = ""; }
      }
      renderPreview(); persist(); refreshReview();
    }
  });
  main.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.f) { S[t.dataset.f] = t.type === "number" ? t.value : t.value; renderPreview(); persist(); refreshReview(); }
    if (t.dataset.c) { S[t.dataset.c] = t.checked; persist(); refreshReview(); }
  });
  document.getElementById("stepper").addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]"); if (t) { step = Number(t.dataset.go); render(true); }
  });

  function doCopy() {
    var out = document.getElementById("out"), msg = document.getElementById("msg");
    function ok() { msg.textContent = "Copied. Paste it into your message to the creator."; }
    function fallback() { out.focus(); out.select(); msg.textContent = "Text selected. Press Ctrl+C (or Copy on your phone)."; }
    try { navigator.clipboard.writeText(out.value).then(ok, fallback); } catch (err) { fallback(); }
  }

  render(false);
})();
</script>

</body></html>
